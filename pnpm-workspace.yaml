packages:
  - "packages/*"
  - "services/*"
  - "apps/*"
  - "tools/*"

# ─── Version Catalog ────────────────────────────────────────────────────────
# Single source of truth for shared runtime dependency versions.
# All package.json files must reference catalogued deps via "catalog:" prefix.
# Violations are caught by `pnpm workspace-lint` (tools/workspace-lint).
catalog:
  # ── Web framework & validation ──────────────────────────────────────────
  express: "^4.21.1"
  zod: "^3.24.1"
  cors: "^2.8.5"
  cookie-parser: "^1.4.7"

  # ── Database & ORM ──────────────────────────────────────────────────────
  prisma: "^6.2.1"
  "@prisma/client": "^6.2.1"

  # ── Authentication & Crypto ─────────────────────────────────────────────
  argon2: "^0.41.1"
  jsonwebtoken: "^9.0.2"

  # ── Logging & Observability ─────────────────────────────────────────────
  pino: "^9.5.0"
  pino-pretty: "^13.0.0"
  "@opentelemetry/api": "^1.9.0"
  "@opentelemetry/sdk-node": "^0.57.0"
  "@opentelemetry/auto-instrumentations-node": "^0.55.0"

  # ── Messaging ────────────────────────────────────────────────────────────
  amqplib: "^0.10.5"

  # ── Payments ─────────────────────────────────────────────────────────────
  stripe: "^17.4.0"

  # ── AI / LLM ─────────────────────────────────────────────────────────────
  "@anthropic-ai/sdk": "^0.34.0"

  # ── Caching ──────────────────────────────────────────────────────────────
  redis: "^4.7.0"
  ioredis: "^5.3.2"

  # ── HTTP client ──────────────────────────────────────────────────────────
  axios: "^1.7.9"

  # ── Testing ──────────────────────────────────────────────────────────────
  vitest: "^2.1.9"
  jest: "^29.7.0"
  supertest: "^7.0.0"
  "@testing-library/react": "^16.1.0"
  "@testing-library/jest-dom": "^6.6.3"
  msw: "^2.7.0"

  # ── Build tooling ────────────────────────────────────────────────────────
  esbuild: "^0.24.0"
  tsx: "^4.19.2"
  typescript: "^5.7.2"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  esbuild: true
  prisma: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - argon2
  - esbuild
  - prisma
